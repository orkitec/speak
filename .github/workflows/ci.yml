name: ci

# The package's checks: format, analysis, the unit tests on the VM and in
# Chrome (JS and Wasm, with the browser's real engine), the pana score, and
# the shared scenarios against the real engine on the iOS simulator, macOS
# and an Android emulator.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs of the iOS and macOS jobs, side by side (a soak test)
        type: number
        default: 1
  # publish.yml runs the whole of it before a release.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  # The runs of the iOS and macOS jobs: [1] unless dispatched with `repeat`.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.runs.outputs.runs }}
    steps:
      - id: runs
        env:
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          case "$REPEAT" in ''|*[!0-9]*) echo "::error::repeat must be a number"; exit 1 ;; esac
          if [ "$REPEAT" -lt 1 ] || [ "$REPEAT" -gt 10 ]; then
            echo "::error::repeat must be from 1 to 10"; exit 1
          fi
          echo "runs=$(seq -s, 1 "$REPEAT" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib example/integration_test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Analyze the example
        working-directory: example
        run: flutter analyze --fatal-infos
      - name: Unit tests (VM)
        run: flutter test --coverage
      - name: Unit and engine tests (Chrome)
        run: tool/web_test.sh
      - name: Unit and engine tests (Chrome, Wasm)
        run: tool/web_test.sh --wasm
      - name: Publish (dry run)
        run: dart pub publish --dry-run

  pana:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: dart pub global activate pana
      - name: pana (fails below 160 points)
        run: |
          dart pub global run pana --no-warning --json . > "$RUNNER_TEMP/pana.json"
          python3 - "$RUNNER_TEMP/pana.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          granted, maximum = report["scores"]["grantedPoints"], report["scores"]["maxPoints"]
          for section in report["report"]["sections"]:
              print(f"{section['grantedPoints']}/{section['maxPoints']} {section['title']}")
              if section["grantedPoints"] < section["maxPoints"]:
                  print(section["summary"])
          print(f"pana: {granted}/{maximum}")
          sys.exit(0 if granted == maximum else 1)
          PY

  ios:
    needs: plan
    name: ios${{ matrix.run > 1 && format(' {0}', matrix.run) || '' }}
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime
                    for d in ds if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Integration tests (iOS simulator)
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        # Boots and warms up the simulator, then two app launches (all files
        # but one in the first), each bounded with one retry: on a fresh
        # runner the tool sometimes never attaches and would wait until the
        # job's time runs out.
        run: bash tool/ios_integration_test.sh
      # App Review rejects apps containing CallKit on the China storefront:
      # the glue must not link it, in the simulator build the tests ran and
      # in a device build.
      - name: CallKit is not linked
        if: matrix.run == 1
        working-directory: example
        run: |
          flutter build ios --debug --no-codesign
          ../tool/check_no_callkit.sh \
            build/ios/iphonesimulator/Runner.app/Frameworks/speak_darwin.framework/speak_darwin \
            build/ios/iphoneos/Runner.app/Frameworks/speak_darwin.framework/speak_darwin

  macos:
    needs: plan
    name: macos${{ matrix.run > 1 && format(' {0}', matrix.run) || '' }}
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # One app launch; the example's debug build is unsandboxed, see
      # "Known issues" in the README.
      - name: Integration tests (macOS)
        run: tool/macos_integration_test.sh

  android:
    name: android ${{ matrix.api-level }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Play Store image, for an engine with installed voices
          # ("Speech Services by Google").
          - api-level: 34
            target: google_apis_playstore
          # The plain Google APIs image, which apps test on too: its engine
          # starts before it has loaded its voices.
          - api-level: 31
            target: google_apis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        working-directory: example
      # The tests' first line marks the emulator as booted: a run that fails
      # without the mark failed to boot and is tried once more; one that
      # fails with it failed a test and is not.
      - name: Integration tests (Android emulator)
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          working-directory: example
          emulator-options: >-
            -no-window -no-snapshot-save -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            touch "$GITHUB_WORKSPACE/.emulator-booted"
            bash ../tool/android_integration_test.sh
      - name: The emulator did not boot; once more
        id: again
        if: steps.emulator.outcome == 'failure' && hashFiles('.emulator-booted') == ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          working-directory: example
          emulator-options: >-
            -no-window -no-snapshot-save -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            echo "::warning::the emulator did not boot the first time"
            bash ../tool/android_integration_test.sh
      - name: Verdict
        if: steps.emulator.outcome == 'failure' && steps.again.outcome != 'success'
        run: exit 1

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_OPTS: --severity=warning
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          "$RUNNER_TEMP/actionlint" -color
