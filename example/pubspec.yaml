name: speak_example
description: Demonstrates the speak package.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  speak:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  # The interruption scenarios play a call through the platform's own APIs.
  jni_flutter: ^1.0.4
  objective_c: ^9.6.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
