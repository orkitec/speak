include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by tool/ffigen.dart and tool/jnigen.dart.
    - lib/src/darwin/av_bindings.dart
    - lib/src/android/jni_bindings.dart
    - build/**
    - example/build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - public_member_api_docs
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_lambdas
    - use_super_parameters
